<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | AF</title>
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <svg class="logo" viewBox="0 0 240 260" width="40" height="43" aria-hidden="true">
        <polyline points="60,110 60,70 120,20 180,70 180,110" fill="none" stroke="#3a4a1f" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="120" cy="150" r="90" fill="#12160b" stroke="#3a4a1f" stroke-width="12"/>
        <circle cx="120" cy="150" r="58" fill="none" stroke="#a3b073" stroke-width="2"/>
        <g stroke="#d3dba8" stroke-width="8" stroke-linecap="square">
          <line x1="120" y1="46" x2="120" y2="92"/>
          <line x1="120" y1="208" x2="120" y2="254"/>
          <line x1="14" y1="150" x2="60" y2="150"/>
          <line x1="180" y1="150" x2="226" y2="150"/>
        </g>
        <g stroke="#a3b073" stroke-width="4" stroke-linecap="round">
          <line x1="83" y1="113" x2="97" y2="127"/>
          <line x1="157" y1="113" x2="143" y2="127"/>
          <line x1="83" y1="187" x2="97" y2="173"/>
          <line x1="157" y1="187" x2="143" y2="173"/>
        </g>
        <rect x="97" y="127" width="46" height="46" transform="rotate(45 120 150)" fill="none" stroke="#d3dba8" stroke-width="9"/>
        <circle cx="120" cy="150" r="7" fill="#d3dba8"/>
      </svg>
      <span class="brand-text">AF</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Forums</a>
      <a href="members.html">Members</a>
      <a href="rules.html">Rules</a>
      <span id="nav-auth-slot"><a href="auth.html" class="active">Login</a></span>
    </nav>
  </div>
</header>

<main class="container auth-container">
  <div class="auth-box">
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-tab="login">Log In</button>
      <button type="button" class="auth-tab" data-tab="signup">Sign Up</button>
    </div>

    <form id="login-form" class="auth-form">
      <input type="text" id="login-username" placeholder="Username" autocomplete="username" required>
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Log In</button>
      <p class="auth-error" id="login-error"></p>
      <a href="#" id="forgot-password-link" class="forgot-link">Forgot password?</a>
    </form>

    <form id="signup-form" class="auth-form auth-form-hidden">
      <input type="text" id="signup-username" placeholder="Username" autocomplete="username" required>
      <input type="email" id="signup-email" placeholder="Email" autocomplete="email" required>
      <input type="password" id="signup-password" placeholder="Password (min 6 characters)" autocomplete="new-password" minlength="6" required>
      <div id="captcha-signup"></div>
      <button type="submit">Create Account</button>
      <p class="auth-error" id="signup-error"></p>
    </form>

    <form id="forgot-form" class="auth-form auth-form-hidden">
      <p class="forgot-intro">Enter your username and we'll email a reset link to the address on file.</p>
      <input type="text" id="forgot-username" placeholder="Username" autocomplete="username" required>
      <button type="submit">Send Reset Link</button>
      <p class="auth-error" id="forgot-error"></p>
      <p class="auth-success" id="forgot-success"></p>
      <a href="#" id="back-to-login-link" class="forgot-link">Back to log in</a>
    </form>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; 2026 AF (Airsoft Forum).</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js?v=5"></script>
<script src="auth-nav.js?v=5"></script>
<script src="https://js.hcaptcha.com/1/api.js?onload=onHcaptchaReady&render=explicit" async defer></script>
<script src="auth.js?v=5"></script>
</body>
</html>
